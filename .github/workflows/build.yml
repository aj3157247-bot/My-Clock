name: Build My Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer setuptools
          pip install "cython<3"

      - name: Clean
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Build My Clock
        shell: bash
        run: |
          set +e

          buildozer -v android debug 2>&1 | tee build.log

          CODE=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "          BUILD EXIT CODE: $CODE"
          echo "=========================================="

          echo ""
          echo "=========================================="
          echo "          LAST 150 LINES"
          echo "=========================================="

          tail -n 150 build.log

          echo ""
          echo "=========================================="
          echo "          ERRORS FOUND"
          echo "=========================================="

          grep -inE \
            "error|failed|exception|traceback|fatal|aidl|command failed|not found|no such file|cannot|could not" \
            build.log \
            | tail -n 100 || true

          echo ""
          echo "=========================================="
          echo "          BUILD FINISHED"
          echo "=========================================="

          if find bin -type f -name "*.apk" 2>/dev/null | grep -q .; then
            echo "APK CREATED!"
          else
            echo "APK NOT CREATED"
          fi

          exit 0

      - name: Check APK
        run: |
          echo "=========================================="
          echo "          CHECKING APK"
          echo "=========================================="

          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-apk
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-build-log
          path: build.log
          if-no-files-found: ignore
