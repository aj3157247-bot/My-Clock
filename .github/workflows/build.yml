name: Build My Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Check Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m pip --version

      - name: Install Build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer==1.5.0
          pip install "cython==0.29.36"

      - name: Clean old build
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin
          rm -rf build

      - name: Build My Clock APK
        shell: bash
        env:
          PIP_NO_CACHE_DIR: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -o pipefail

          echo "=========================================="
          echo "PYTHON VERSION"
          echo "=========================================="
          python --version

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          buildozer -v android debug 2>&1 | tee build.log

      - name: Show important errors
        if: failure()
        run: |
          echo "=========================================="
          echo "IMPORTANT ERRORS"
          echo "=========================================="

          grep -inE \
            "error:|error |failed|exception|traceback|fatal|aidl|command failed|not found|no such file|cannot|could not|unsupported wheel" \
            build.log \
            | tail -n 150 || true

      - name: Check APK
        if: always()
        run: |
          echo "=========================================="
          echo "CHECKING APK"
          echo "=========================================="

          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-build-log
          path: build.log
          if-no-files-found: ignore
