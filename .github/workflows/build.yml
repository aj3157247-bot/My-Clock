name: Build My Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython<3"

      - name: Clean Build
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin
          rm -f build.log

      - name: Build My Clock
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e

          buildozer -v android debug > build.log 2>&1

          BUILD_EXIT=$?

          echo ""
          echo "=========================================="
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "=========================================="

          echo ""
          echo "========== LAST 200 LINES =========="
          tail -n 200 build.log

          echo ""
          echo "========== SEARCHING ERRORS =========="

          grep -inE \
            "error|failed|exception|traceback|fatal|aidl|command failed|exit code|not found|no such file|could not|cannot" \
            build.log \
            | tail -n 200 || true

          exit $BUILD_EXIT

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-apk
          path: bin/*.apk
          if-no-files-found: error
