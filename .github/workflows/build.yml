name: Build My Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip -q
          pip install buildozer setuptools -q
          pip install cython==0.29.34 -q

      - name: Clean old Buildozer files
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Build My Clock
        run: |
          set -o pipefail

          buildozer -v android debug > build.log 2>&1

      - name: Show Build Result
        if: always()
        run: |
          echo "========================================"
          echo "          MY CLOCK BUILD RESULT"
          echo "========================================"

          APK=$(find bin -name "*.apk" -type f 2>/dev/null | head -n 1)

          if [ -n "$APK" ]; then
            echo ""
            echo "✅ APK CREATED SUCCESSFULLY"
            echo ""
            ls -lh "$APK"
            echo ""
            echo "APK FILE:"
            echo "$APK"
          else
            echo ""
            echo "❌ APK WAS NOT CREATED"
            echo ""
            echo "========== IMPORTANT ERRORS =========="

            grep -iE \
              "error:|error |failed|exception|traceback|fatal|aidl not found|command failed|exit code" \
              build.log \
              | tail -n 100 || true

            echo ""
            echo "========== LAST 50 LINES =========="

            tail -n 50 build.log
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload My Clock APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-apk
          path: bin/*.apk
          if-no-files-found: error
