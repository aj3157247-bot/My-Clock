name: Build My Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install "cython<3"

      - name: Clean old build
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Build My Clock APK
        shell: bash
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      - name: Show important errors
        if: failure()
        run: |
          echo "=========================================="
          echo "IMPORTANT ERRORS"
          echo "=========================================="

          grep -inE \
            "error|failed|exception|traceback|fatal|aidl|command failed|not found|no such file|cannot|could not" \
            build.log \
            | tail -n 100 || true

      - name: Check APK
        if: always()
        run: |
          echo "=========================================="
          echo "CHECKING APK"
          echo "=========================================="

          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-build-log
          path: build.log
          if-no-files-found: ignore
