name: Build My Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer setuptools
          pip install "cython<3"

      - name: Clean old Buildozer
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin
          rm -f build.log

      - name: Build My Clock
        id: build
        continue-on-error: true
        run: |
          buildozer -v android debug > build.log 2>&1
          echo "Buildozer exit code: $?" 

      - name: Show REAL error
        run: |
          echo ""
          echo "=============================================="
          echo "              BUILD RESULT"
          echo "=============================================="

          APK=$(find bin -type f -name "*.apk" 2>/dev/null | head -n 1)

          if [ -n "$APK" ]; then
            echo ""
            echo "APK CREATED SUCCESSFULLY"
            echo ""
            ls -lh "$APK"
          else
            echo ""
            echo "APK WAS NOT CREATED"
            echo ""
            echo "=============================================="
            echo "             ERROR SEARCH"
            echo "=============================================="

            grep -inE \
              "error|failed|exception|traceback|fatal|aidl|command failed|exit code|not found|no such file|could not|cannot" \
              build.log \
              | tail -n 200 || true

            echo ""
            echo "=============================================="
            echo "             LAST 120 LINES"
            echo "=============================================="

            tail -n 120 build.log
          fi

      - name: Upload complete log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-apk
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Finish
        if: steps.build.outcome == 'failure'
        run: |
          echo ""
          echo "Buildozer failed."
          echo "The actual Buildozer error is printed in the previous step."
          exit 1
