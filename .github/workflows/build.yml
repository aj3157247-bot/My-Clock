name: Build My Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip -q
          pip install buildozer setuptools -q
          pip install "cython<3" -q

      - name: Clean old files
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin
          rm -f build.log

      - name: Build My Clock
        id: build
        continue-on-error: true
        run: |
          buildozer -v android debug > build.log 2>&1
          echo "BUILD_EXIT_CODE=$?" >> build_result.txt

      - name: Show real build result
        run: |
          echo "========================================"
          echo "        MY CLOCK BUILD RESULT"
          echo "========================================"

          APK=$(find bin -type f -name "*.apk" 2>/dev/null | head -n 1)

          if [ -n "$APK" ]; then
            echo ""
            echo "========================================"
            echo "       APK CREATED SUCCESSFULLY"
            echo "========================================"
            echo ""
            ls -lh "$APK"
          else
            echo ""
            echo "========================================"
            echo "          APK WAS NOT CREATED"
            echo "========================================"
            echo ""
            echo "REAL BUILD ERROR:"
            echo ""

            grep -iE \
              "error:|error |failed|exception|traceback|fatal|aidl not found|command failed|exit code|no such file|not found" \
              build.log \
              | tail -n 150 || true

            echo ""
            echo "========== LAST 80 LINES =========="
            tail -n 80 build.log
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload My Clock APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myclock-apk
          path: bin/*.apk
          if-no-files-found: ignore

      - name: Fail if APK was not created
        if: steps.build.outcome == 'failure'
        run: |
          echo "Buildozer failed."
          echo "The real error is shown above."
          exit 1
